defaults: base.yaml
output_dir: runs/aux_three_class

data:
  cohort_flag: three_class_cohort
  label_column: three_class_label
  label_shift: -1
  num_classes: 3
  signal_kind: ecg
  signal_file_template: "ecg_{split}_filtered_mV_12x5000_float16.npy"
  input_length: 5000
  use_precomputed_folds: false
  use_clinical: false

model:
  name: ms_resnet1d

training:
  learning_rate: 0.0003

