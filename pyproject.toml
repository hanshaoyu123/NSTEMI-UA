[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nstemi-ecg"
version = "0.1.0"
description = "Patient-level deep learning for NSTEMI identification from pre-angiography 12-lead ECGs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "torch>=2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
nstemi-train = "nstemi_ecg.cli:train_main"
nstemi-predict = "nstemi_ecg.cli:predict_main"
nstemi-robustness = "nstemi_ecg.cli:robustness_main"
nstemi-interpret = "nstemi_ecg.cli:interpret_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
